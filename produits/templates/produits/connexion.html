{% load static %}

<link rel="stylesheet" href="{% static 'produits/css/formulaire.css' %}">
<link rel="stylesheet" href="{% static 'produits/css/menu.css' %}">

{% include "produits/partials/menu.html" %}

<h1>Connexion</h1>

{% if erreur %}
    <p class="erreur">{{ erreur }}</p>
{% endif %}

<form method="post">

    {% csrf_token %}

    <p>
        <label for="username">
            Nom d'utilisateur
        </label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </p>

    <p>
        <label for="password">
            Mot de passe
        </label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </p>

    <button type="submit">
        Se connecter
    </button>

</form>

<p>
    Pas encore de compte ?
    <a href="{% url 'inscription' %}">
        Créer un compte
    </a>
</p>
