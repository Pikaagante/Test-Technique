<div class="filtres">

    <h2>Filtres</h2>

    <input
        type="text"
        id="recherche"
        placeholder="Rechercher..."
    >

    <hr>

    <h3>Catégorie</h3>

    <label>
        <input type="checkbox" name="categorie" value="Fruit">
        Fruit
    </label>

    <label>
        <input type="checkbox" name="categorie" value="Légume">
        Légume
    </label>

    <label>
        <input type="checkbox" name="categorie" value="Viande">

    </label>

    <label>

    <label>

        Boulangerie
    </label>

    <label>
        <input type="checkbox" name="categorie" value="Confiserie">

    </label>

    <label>
        <input type="checkbox" name="categorie" value="Autre">

    <h3>Prix</h3>

    <input
        type="number"
        id="prix-min"
        placeholder="Prix minimum"

    <input
        type="number"
        id="prix-max"
        placeholder="Prix maximum"

    <hr>

    <h3>Nutri-Score</h3>

    <label>

    <label>

    <label>

    <label>

    <label>
        <input type="checkbox" name="label" value="aop">

    <label>
        <input type="checkbox" name="label" value="igp">
