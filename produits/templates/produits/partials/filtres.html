<form method="get" id="form-filtres">

    <div class="filtres">

        <h2>Filtres</h2>

        <input
            type="text"
            name="recherche"
            id="recherche"
            value="{{ recherche }}"
            placeholder="Rechercher..."
        >

        <hr>

        <h3>Catégorie</h3>

        {% for valeur, nom in categories %}

            <label>
                <input
                    type="checkbox"
                    name="categorie"
                    value="{{ valeur }}"
                    {% if valeur in selected_categories %}checked{% endif %}
                >
                {{ nom }}
            </label>

        {% endfor %}

        <hr>

        <h3>Prix</h3>

        <input
            type="number"
            name="prix_min"
            id="prix-min"
            value="{{ prix_min }}"
            placeholder="Prix minimum"
            step="0.01"
        >

        <input
            type="number"
            name="prix_max"
            id="prix-max"
            value="{{ prix_max }}"
            placeholder="Prix maximum"
            step="0.01"
        >

        <hr>

        <h3>Nutri-Score</h3>

        {% for valeur, nom in nutriscores %}

            <label>
                <input
                    type="checkbox"
                    name="nutriscore"
                    value="{{ valeur }}"
                    {% if valeur in selected_nutriscores %}checked{% endif %}
                >
                {{ nom }}
            </label>

        {% endfor %}

        <hr>

        <h3>Labels</h3>

        <label>
            <input
                type="checkbox"
                name="label"
                value="bio"
                {% if "bio" in selected_labels %}checked{% endif %}
            >
            Bio
        </label>

        <label>
            <input
                type="checkbox"
                name="label"
                value="label_rouge"
                {% if "label_rouge" in selected_labels %}checked{% endif %}
            >
            Label Rouge
        </label>

        <label>
            <input
                type="checkbox"
                name="label"
                value="aop"
                {% if "aop" in selected_labels %}checked{% endif %}
            >
            AOP
        </label>

        <label>
            <input
                type="checkbox"
                name="label"
                value="igp"
                {% if "igp" in selected_labels %}checked{% endif %}
            >
            IGP
        </label>

        <hr>

        <h3>Origine</h3>

        <label>
            <input
                type="checkbox"
                name="origine"
                value="France"
                {% if "France" in selected_origines %}checked{% endif %}
            >
            France
        </label>

        <label>
            <input
                type="checkbox"
                name="origine"
                value="Italie"
                {% if "Italie" in selected_origines %}checked{% endif %}
            >
            Italie
        </label>

        <label>
            <input
                type="checkbox"
                name="origine"
                value="Espagne"
                {% if "Espagne" in selected_origines %}checked{% endif %}
            >
            Espagne
        </label>

        <button type="submit">
            Filtrer
        </button>

    </div>

</form>
