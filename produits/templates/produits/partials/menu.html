<script>
    const utilisateurConnecte = {{ user.is_authenticated|yesno:"true,false" }};
</script>

<nav class="menu">

    <div class="menu-gauche">

        <a href="{% url 'liste_produits' %}" class="logo">
            🛒 MonShop
        </a>

        <a href="{% url 'liste_produits' %}">
            Produits
        </a>

        <a href="{% url 'liste_factures' %}">
            🧾 Factures
        </a>

        <div class="panier">

            <button
                class="panier-bouton"
                onclick="ouvrirPanier()"
            >
                🛍️
                <span id="nombre-produits">0</span>
            </button>

        </div>

        {% if user.is_staff %}

            <a href="{% url 'ajouter_produit' %}">
                Ajouter un produit
            </a>

        {% endif %}

    </div>


    <div class="menu-droite">

        {% if user.is_authenticated %}

            <div class="profil">

                <button class="profil-bouton">
                    👤 {{ user.username }} ▼
                </button>

                <div class="profil-menu">

                    <a href="#">
                        Mon profil
                    </a>

                    <a href="{% url 'liste_factures' %}">
                        Mes factures
                    </a>

                    <a href="{% url 'deconnexion' %}">
                        Déconnexion
                    </a>

                </div>

            </div>

        {% else %}

            <a href="{% url 'connexion' %}">
                Se connecter
            </a>

            <a href="{% url 'inscription' %}">
                S'inscrire
            </a>

        {% endif %}

    </div>

</nav>


<div id="popup-panier" class="popup-panier">

    <div class="popup-panier-contenu">

        <button
            class="fermer-panier"
            onclick="fermerPanier()"
        >
            &times;
        </button>

        <h2>Ma facture</h2>

        <div id="panier-contenu">

            <p>
                Votre facture est vide.
            </p>

        </div>

        <div class="panier-bas">

            <strong>
                Total :
                <span id="panier-total">0.00</span> €
            </strong>

            <button onclick="confirmerFacture()">
                Confirmer
            </button>

        </div>

    </div>

</div>

<div id="notification" class="notification"></div>
