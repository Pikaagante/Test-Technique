<nav class="menu">

    <div class="menu-gauche">

        <a href="{% url 'liste_produits' %}" class="logo">
            🛒 MonShop
        </a>

        <a href="{% url 'liste_produits' %}">
            Produits
        </a>

        {% if user.is_authenticated %}
            <a href="{% url 'liste_factures' %}">
                🧾 Factures
            </a>
        {% endif %}

        <div class="panier">

            <button class="panier-bouton" onclick="ouvrirPanier()">
                🛍️
                <span id="nombre-produits">
                    0
                </span>
            </button>

        </div>

        {% if user.is_staff %}

            <a href="{% url 'ajouter_produit' %}">
                Ajouter un produit
            </a>

        {% endif %}

    </div>


    <div class="menu-droite">

        {% if user.is_authenticated %}

            <div class="profil">

                <button class="profil-bouton">
                    👤 {{ user.username }} ▼
                </button>

                <div class="profil-menu">

                    <a href="#">
                        Mon profil
                    </a>

                    <a href="{% url 'liste_factures' %}">
                        Mes factures
                    </a>

                    <a href="{% url 'deconnexion' %}">
                        Déconnexion
                    </a>

                </div>

            </div>

        {% else %}

            <a href="{% url 'connexion' %}">
                Se connecter
            </a>

            <a href="{% url 'inscription' %}">
                S'inscrire
            </a>

        {% endif %}

    </div>

</nav>


<div id="popup-panier" class="popup-panier">

    <div class="popup-panier-contenu">

        <button
            type="button"
            class="fermer-panier"
            onclick="fermerPanier()"
        >
            ×
        </button>

        <h2 id="panier-titre">
            Votre panier
        </h2>

        <div id="panier-contenu">
        </div>

        <div class="panier-bas">

            <strong>
                Total :
                <span id="panier-total">
                    0 €
                </span>
            </strong>

            <button
                type="button"
                id="confirmer-panier"
                onclick="confirmerFacture()"
            >
                Confirmer la commande
            </button>

        </div>

        <button
            type="button"
            id="annuler-modification"
            class="annuler-modification"
            onclick="annulerModification()"
        >
            Annuler la modification
        </button>

    </div>

</div>


<div id="notification" class="notification"></div>


<script>

    const utilisateurConnecte =
        {{ user.is_authenticated|yesno:"true,false" }};

</script>
